[project]
name = "faultforge"
version = "0.1.0"
description = "Bounded concurrency testing with correctness invariants and reproducible evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.162.0,<1",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
faultforge = "faultforge.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "pytest>=8,<9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: starts real containers; needs Docker and builds the sandbox images"]
