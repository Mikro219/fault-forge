[project]
name = "faultforge"
version = "0.1.0"
description = "Bounded concurrency testing with correctness invariants and reproducible evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
